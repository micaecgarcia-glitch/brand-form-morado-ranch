<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Identidad de Marca - Morado Ranch</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f1eb;
            color: #3e3530;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .header {
            background: linear-gradient(135deg, #faf7f2 0%, #f5f1eb 100%);
            padding: 40px;
            border-radius: 12px;
            border-left: 6px solid #8b7355;
            margin-bottom: 40px;
            box-shadow: 0 2px 8px rgba(139, 115, 85, 0.1);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #6b5b4e;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #8b7355;
            font-size: 14px;
            margin: 4px 0;
            font-weight: 500;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #e8e3db;
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background-color: #8b7355;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        
        .intro-text {
            background-color: #faf7f2;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #d4a574;
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.7;
        }
        
        .intro-text strong {
            color: #6b5b4e;
        }
        
        .respondent-section {
            background-color: #faf7f2;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #e8e3db;
        }
        
        .respondent-section h2 {
            font-size: 18px;
            color: #6b5b4e;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .respondent-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .respondent-fields select {
            grid-column: 1 / -1;
        }
        
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e8e3db;
            border-radius: 6px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            color: #3e3530;
            background-color: white;
            transition: border-color 0.2s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #8b7355;
            box-shadow: 0 0 0 3px rgba(139, 115, 85, 0.1);
        }
        
        .accordion {
            margin-bottom: 15px;
        }
        
        .accordion-header {
            background-color: #f5f1eb;
            padding: 16px;
            border: 1px solid #e8e3db;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            font-weight: 500;
            color: #6b5b4e;
        }
        
        .accordion-header:hover {
            background-color: #ede8e0;
            border-color: #d4a574;
        }
        
        .accordion-header.active {
            background-color: #8b7355;
            color: white;
            border-color: #8b7355;
        }
        
        .accordion-header .toggle {
            font-size: 18px;
            transition: transform 0.3s;
        }
        
        .accordion-header.active .toggle {
            transform: rotate(180deg);
        }
        
        .accordion-content {
            display: none;
            padding: 20px;
            background-color: white;
            border: 1px solid #e8e3db;
            border-top: none;
            border-radius: 0 0 6px 6px;
        }
        
        .accordion-content.active {
            display: block;
        }
        
        .question-group {
            margin-bottom: 25px;
        }
        
        .question-group:last-child {
            margin-bottom: 0;
        }
        
        .question-label {
            font-weight: 600;
            color: #6b5b4e;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
        }
        
        .question-hint {
            font-size: 12px;
            color: #8b7355;
            font-style: italic;
            margin-bottom: 8px;
            display: block;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: 'Roboto', sans-serif;
        }
        
        .audio-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        
        .audio-btn {
            padding: 8px 16px;
            background-color: #d4a574;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .audio-btn:hover {
            background-color: #c49563;
        }
        
        .audio-btn.recording {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .audio-status {
            font-size: 12px;
            color: #8b7355;
            margin-top: 5px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e8e3db;
        }
        
        .btn-reset,
        .btn-submit {
            padding: 14px 40px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Roboto', sans-serif;
        }
        
        .btn-reset {
            background-color: #e8e3db;
            color: #6b5b4e;
            border: 1px solid #d4c8bf;
        }
        
        .btn-reset:hover {
            background-color: #ddd2c8;
        }
